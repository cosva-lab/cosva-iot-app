# Cosva IoT Smart Farm Configuration
# This file contains the static configuration for the farm
# Dynamic configuration (MQTT, Database, API) is handled via environment variables

farm:
  id: 'farm-001'
  name: 'Main Dairy Farm'

# Stalls configuration
stalls:
  - id: 'stall-001'
    number: 1
    sensor_id: 'RFID01'
    rfid_id: 'reader-01'
    scale_id: 'scale-01'
    status: 'available'

  - id: 'stall-002'
    number: 2
    sensor_id: 'RFID02'
    rfid_id: 'reader-02'
    scale_id: 'scale-02'
    status: 'available'

  - id: 'stall-003'
    number: 3
    sensor_id: 'RFID03'
    rfid_id: 'reader-03'
    scale_id: 'scale-03'
    status: 'available'

  - id: 'stall-004'
    number: 4
    sensor_id: 'RFID04'
    rfid_id: 'reader-04'
    scale_id: 'scale-04'
    status: 'available'

  - id: 'stall-005'
    number: 5
    sensor_id: 'RFID05'
    rfid_id: 'reader-05'
    scale_id: 'scale-05'
    status: 'available'

  - id: 'stall-006'
    number: 6
    sensor_id: 'RFID06'
    rfid_id: 'reader-06'
    scale_id: 'scale-06'
    status: 'available'

# Sensor configuration
sensors:
  - sensor_id: 'RFID01'
    stall_number: 1
    protocol: 'serial'
    port: '/dev/ttyUSB0'
    baud_rate: 9600
    timeout: 2

  - sensor_id: 'RFID02'
    stall_number: 2
    protocol: 'serial'
    port: '/dev/ttyUSB1'
    baud_rate: 9600
    timeout: 2

  - sensor_id: 'RFID03'
    stall_number: 3
    protocol: 'wifi'
    ip: '192.168.1.102'
    port_number: 8080
    timeout: 2

  - sensor_id: 'RFID04'
    stall_number: 4
    protocol: 'wifi'
    ip: '192.168.1.103'
    port_number: 8080
    timeout: 2

  - sensor_id: 'RFID05'
    stall_number: 5
    protocol: 'serial'
    port: '/dev/ttyUSB2'
    baud_rate: 9600
    timeout: 2

  - sensor_id: 'RFID06'
    stall_number: 6
    protocol: 'serial'
    port: '/dev/ttyUSB3'
    baud_rate: 9600
    timeout: 2

milking:
  noise_kg: 0.05
  container_drop_kg: 0.5
  container_stable_seconds: 4
  tare_min_kg: 1.0
  tare_max_kg: 9.0
  empty_platform_kg: 0.5
  occupancy_grace_seconds: 40
  min_milk_kg: 0.05
  milk_density_kg_per_liter: 1.03
  treatment_lookback_days: 7
  # real | simulated — simulated blocks Cosva upload + skips equipment Start gate
  data_source: real
  # true = show Demo milking button in parlor UI (local demos only)
  demo_ui: false
  # Optional: lock parlor to Cosva animal groups (hato/rebaño). Omit to filter in UI.
  # herd_filter_group_ids: ['123']
  # herd_filter_group_names: ['Lote A']
