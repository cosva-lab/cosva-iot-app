# Live reload for local dev. Use with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Or: npm run dev:watch
#
# Bind-mounts cosva-iot dist/ into node_modules and polls for changes.
# No image rebuild. Obfuscation stays off because dev:watch builds with ROLLUP_OBFUSCATE=0.

x-dev-env: &dev-env
  NODE_ENV: development
  DEV_APP_ROOT: /app
  DEV_PRISMA: /app/node_modules/@cosva-lab/iot-db/prisma
  DEV_POLL_MS: "200"

services:
  dashboard-service:
    user: "0:0"
    working_dir: /app/services/dashboard
    entrypoint: ["node", "/app/scripts/dev/watch-service.mjs"]
    environment:
      <<: *dev-env
      DEV_CWD: /app/services/dashboard
      DEV_WATCH: /app/node_modules/@cosva-lab/iot-dashboard/dist/index.js,/app/node_modules/@cosva-lab/iot-db/dist/index.js,/app/node_modules/@cosva-lab/iot-shared/dist/index.js
    volumes:
      - ../cosva-iot/packages/dashboard/dist:/app/node_modules/@cosva-lab/iot-dashboard/dist
      - ../cosva-iot/packages/db/dist:/app/node_modules/@cosva-lab/iot-db/dist
      - ../cosva-iot/packages/db/prisma:/app/node_modules/@cosva-lab/iot-db/prisma
      - ../cosva-iot/packages/shared/dist:/app/node_modules/@cosva-lab/iot-shared/dist
      - ./scripts/dev/watch-service.mjs:/app/scripts/dev/watch-service.mjs:ro

  sensor-service:
    user: "0:0"
    working_dir: /app/services/sensor
    entrypoint: ["node", "/app/scripts/dev/watch-service.mjs"]
    environment:
      <<: *dev-env
      DEV_CWD: /app/services/sensor
      DEV_MIGRATE: "0"
      DEV_WATCH: /app/node_modules/@cosva-lab/iot-sensor/dist/index.js,/app/node_modules/@cosva-lab/iot-db/dist/index.js,/app/node_modules/@cosva-lab/iot-shared/dist/index.js
    volumes:
      - ../cosva-iot/packages/sensor/dist:/app/node_modules/@cosva-lab/iot-sensor/dist
      - ../cosva-iot/packages/db/dist:/app/node_modules/@cosva-lab/iot-db/dist
      - ../cosva-iot/packages/db/prisma:/app/node_modules/@cosva-lab/iot-db/prisma
      - ../cosva-iot/packages/shared/dist:/app/node_modules/@cosva-lab/iot-shared/dist
      - ./scripts/dev/watch-service.mjs:/app/scripts/dev/watch-service.mjs:ro

  sync-service:
    user: "0:0"
    working_dir: /app/services/sync
    entrypoint: ["node", "/app/scripts/dev/watch-service.mjs"]
    environment:
      <<: *dev-env
      DEV_CWD: /app/services/sync
      DEV_MIGRATE: "0"
      DEV_WATCH: /app/node_modules/@cosva-lab/iot-sync/dist/index.js,/app/node_modules/@cosva-lab/iot-db/dist/index.js,/app/node_modules/@cosva-lab/iot-shared/dist/index.js
    volumes:
      - ../cosva-iot/packages/sync/dist:/app/node_modules/@cosva-lab/iot-sync/dist
      - ../cosva-iot/packages/db/dist:/app/node_modules/@cosva-lab/iot-db/dist
      - ../cosva-iot/packages/db/prisma:/app/node_modules/@cosva-lab/iot-db/prisma
      - ../cosva-iot/packages/shared/dist:/app/node_modules/@cosva-lab/iot-shared/dist
      - ./scripts/dev/watch-service.mjs:/app/scripts/dev/watch-service.mjs:ro
